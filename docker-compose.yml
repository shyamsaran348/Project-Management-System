version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: sdg-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: sdg-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/sdg_project_db
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: sdg-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:

<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register | SDGSync</title>

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .neural-bg {
            background-image: radial-gradient(circle at 2px 2px, #d4c9a8 1px, transparent 0);
            background-size: 40px 40px;
        }
        .segmented-toggle:checked + label {
            background-color: #005129;
            color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-cream neural-bg min-h-screen flex items-center justify-center p-gutter">
<main class="w-full max-w-[520px] relative">
<!-- Floating Accent Elements -->
<div class="absolute -top-12 -left-12 w-24 h-24 bg-primary/10 rounded-full blur-3xl"></div>
<div class="absolute -bottom-12 -right-12 w-32 h-32 bg-sdg-3/10 rounded-full blur-3xl"></div>
<!-- Central Glassmorphic Card -->
<section class="glass-panel border border-sand/30 shadow-md rounded-[28px] overflow-hidden p-stack-lg md:p-10">
<!-- Brand Header -->
<header class="text-center mb-stack-lg">
<div class="flex justify-center mb-4">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">hub</span>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-2">SDGSync</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Empowering institutional collaboration for a sustainable future.</p>
</header>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Role Segmented Toggle -->
<div class="flex p-1 bg-surface rounded-xl border border-sand/20 mb-stack-lg">
<div class="flex-1">
<input checked="" class="hidden segmented-toggle" id="faculty" name="role" type="radio"/>
<label class="block text-center py-2 px-4 rounded-lg font-body-sm text-body-sm text-on-surface-variant cursor-pointer transition-all duration-200" for="faculty">
                            Faculty
                        </label>
</div>
<div class="flex-1">
<input class="hidden segmented-toggle" id="student" name="role" type="radio"/>
<label class="block text-center py-2 px-4 rounded-lg font-body-sm text-body-sm text-on-surface-variant cursor-pointer transition-all duration-200" for="student">
                            Student
                        </label>
</div>
</div>
<!-- Input Fields -->
<div class="grid grid-cols-1 gap-stack-sm">
<!-- Full Name -->
<div class="space-y-1">
<label class="font-mono-label text-mono-label text-text-muted uppercase ml-1" for="full_name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">person</span>
<input class="w-full pl-12 pr-6 py-4 bg-surface border-transparent rounded-xl font-body-base text-body-base focus:ring-4 focus:ring-primary/10 focus:border-primary focus:bg-white transition-all outline-none" id="full_name" name="full_name" placeholder="Dr. Sarah Johnson" type="text"/>
</div>
</div>
<!-- Institutional Email -->
<div class="space-y-1">
<label class="font-mono-label text-mono-label text-text-muted uppercase ml-1" for="email">Institutional Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">mail</span>
<input class="w-full pl-12 pr-6 py-4 bg-surface border-transparent rounded-xl font-body-base text-body-base focus:ring-4 focus:ring-primary/10 focus:border-primary focus:bg-white transition-all outline-none" id="email" name="email" placeholder="s.johnson@university.edu" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-sm">
<!-- Department -->
<div class="space-y-1">
<label class="font-mono-label text-mono-label text-text-muted uppercase ml-1" for="department">Department</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">account_balance</span>
<select class="w-full pl-12 pr-6 py-4 bg-surface border-transparent rounded-xl font-body-base text-body-base focus:ring-4 focus:ring-primary/10 focus:border-primary focus:bg-white transition-all outline-none appearance-none" id="department" name="department">
<option disabled="" selected="" value="">Select Dept.</option>
<option value="env">Environmental Science</option>
<option value="soc">Social Sciences</option>
<option value="eng">Engineering</option>
<option value="econ">Economics</option>
</select>
</div>
</div>
<!-- Dynamic Field: Designation / Roll Number -->
<div class="space-y-1">
<label class="font-mono-label text-mono-label text-text-muted uppercase ml-1" for="id_field">Designation</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">badge</span>
<input class="w-full pl-12 pr-6 py-4 bg-surface border-transparent rounded-xl font-body-base text-body-base focus:ring-4 focus:ring-primary/10 focus:border-primary focus:bg-white transition-all outline-none" id="id_field" name="id_field" placeholder="Professor" type="text"/>
</div>
</div>
</div>
<!-- Password -->
<div class="space-y-1">
<label class="font-mono-label text-mono-label text-text-muted uppercase ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">lock</span>
<input class="w-full pl-12 pr-6 py-4 bg-surface border-transparent rounded-xl font-body-base text-body-base focus:ring-4 focus:ring-primary/10 focus:border-primary focus:bg-white transition-all outline-none" id="password" name="password" placeholder="••••••••••••" type="password"/>
</div>
</div>
</div>
<!-- CTA Button -->
<button class="w-full py-4 px-8 bg-ink-light hover:bg-on-surface text-white font-body-base font-bold rounded-2xl shadow-sm transition-all active:scale-95 duration-200 flex items-center justify-center gap-2 group mt-4" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Redirect Link -->
<p class="text-center mt-6 font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-bold hover:text-accent-hover transition-colors underline-offset-4 hover:underline" href="#">Log in</a>
</p>
</form>
</section>
<!-- Footer Visual Reference (Implicit context for SDGSync) -->
<footer class="mt-stack-lg flex justify-center gap-6 opacity-40 grayscale hover:grayscale-0 transition-all">
<div class="w-10 h-10 bg-sdg-1 rounded-sm" title="No Poverty"></div>
<div class="w-10 h-10 bg-sdg-4 rounded-sm" title="Quality Education"></div>
<div class="w-10 h-10 bg-sdg-13 rounded-sm" title="Climate Action"></div>
<div class="w-10 h-10 bg-sdg-17 rounded-sm" title="Partnerships"></div>
</footer>
</main>
<!-- Decorative Neural Map Visual -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<svg class="absolute w-[120%] h-[120%] -top-10 -left-10 opacity-[0.03]" viewbox="0 0 100 100">
<defs>
<pattern height="10" id="grid" patternunits="userSpaceOnUse" width="10">
<path d="M 10 0 L 0 0 0 10" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
<circle cx="20" cy="20" fill="currentColor" r="1.5"></circle>
<circle cx="50" cy="40" fill="currentColor" r="1.5"></circle>
<circle cx="80" cy="30" fill="currentColor" r="1.5"></circle>
<circle cx="40" cy="80" fill="currentColor" r="1.5"></circle>
<circle cx="70" cy="70" fill="currentColor" r="1.5"></circle>
<path d="M 20 20 L 50 40 L 80 30 M 50 40 L 40 80 L 70 70 M 80 30 L 70 70" fill="none" stroke="currentColor" stroke-width="0.2"></path>
</svg>
</div>
</body></html>
